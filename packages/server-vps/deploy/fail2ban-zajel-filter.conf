# fail2ban filter for Zajel WebSocket connections
# Place in /etc/fail2ban/filter.d/zajel-ws.conf

[Definition]
# Match 429 (rate limit exceeded) or 503 (service unavailable) responses
failregex = ^<HOST> .* "(GET|POST) .* HTTP/\d\.\d" (429|503) .*$
            ^<HOST> .* ".*" 444 0 .*$

ignoreregex =
