# Zajel VPS Server - nginx reverse proxy configuration
# This file is a template - PUBLIC_IP placeholder is replaced during deployment

upstream zajel_backend {
    server 127.0.0.1:9000;
    keepalive 32;
}

# Rate limiting zones
# http_limit: 30 requests/second per IP (burst up to 50 with delay)
limit_req_zone $binary_remote_addr zone=http_limit:10m rate=30r/s;

# conn_limit: max 20 concurrent connections per IP
limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

# HTTP -> HTTPS redirect
server {
    listen 80;
    listen [::]:80;
    server_name PUBLIC_IP;

    # Allow ACME challenge for Let's Encrypt
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # Redirect all other traffic to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS/WSS server
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name PUBLIC_IP;

    # NOTE: HTTP/2 is intentionally NOT enabled. Ubuntu 24.04 ships nginx 1.24.x
    # which does not support RFC 8441 (WebSocket over HTTP/2 / Extended CONNECT).
    # Enabling http2 on the listen directive could cause WebSocket upgrade failures
    # with certain HTTP/2-capable clients. Use HTTP/1.1 only for WebSocket proxying.

    # TLS configuration (certificate paths set by certbot)
    ssl_certificate /etc/letsencrypt/live/PUBLIC_IP/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/PUBLIC_IP/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers off;

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;

    # Real IP forwarding for nginx logging in future load balancer scenarios
    set_real_ip_from 127.0.0.1;
    real_ip_header X-Real-IP;

    # Logging
    access_log /var/log/nginx/zajel-access.log;
    error_log /var/log/nginx/zajel-error.log;

    # NOTE: Rate limiting (limit_conn, limit_req) is applied per-location instead
    # of at the server block level. This allows the /health endpoint to be exempt
    # without using invalid `limit_conn off;` syntax (limit_conn does not support
    # the `off` argument, unlike limit_req which does in nginx 1.18+).

    # Health check endpoint (no rate limit for monitoring)
    location = /health {
        # No limit_conn or limit_req applied here -- health checks are exempt
        proxy_pass http://zajel_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
        proxy_send_timeout 10s;
    }

    # Admin endpoints (/admin, /stats, /metrics) -- excludes /admin/ws
    # The /admin/ws WebSocket path is handled by the / location block below
    location ~ ^/(admin(?!/ws)|stats|metrics) {
        # Connection and request rate limits
        limit_conn conn_limit 20;
        limit_req zone=http_limit burst=50 nodelay;

        proxy_pass http://zajel_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Shorter timeouts for admin endpoints
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    # WebSocket upgrade (for client, federation, and /admin/ws connections)
    location / {
        # Connection and request rate limits
        limit_conn conn_limit 20;
        limit_req zone=http_limit burst=50 nodelay;

        proxy_pass http://zajel_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket timeouts
        proxy_connect_timeout 5s;
        proxy_read_timeout 300s;  # 5 minutes for long-lived WS connections
        proxy_send_timeout 60s;

        # Disable buffering for WebSocket
        proxy_buffering off;
    }
}
