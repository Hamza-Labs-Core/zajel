name: Release - App

permissions:
  contents: read

on:
  push:
    tags:
      - 'v*'

env:
  FLUTTER_VERSION: '3.38.5'

jobs:
  # Check if this is a production release (not a pre-release tag)
  check-production-release:
    runs-on: ubuntu-latest
    outputs:
      is_production: ${{ steps.check.outputs.is_production }}
    steps:
      - name: Check if production release
        id: check
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          echo "Tag: $TAG"
          # Production releases match vX.Y.Z exactly (no suffix like -build.XXXX)
          if [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "This is a production release"
            echo "is_production=true" >> $GITHUB_OUTPUT
          else
            echo "This is a pre-release tag, skipping release workflow"
            echo "is_production=false" >> $GITHUB_OUTPUT
          fi

  # Check if app code changed since last tag
  check-changes:
    runs-on: ubuntu-latest
    needs: check-production-release
    if: needs.check-production-release.outputs.is_production == 'true'
    outputs:
      app_changed: ${{ steps.check.outputs.app_changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check if app files changed
        id: check
        run: |
          # Get the previous tag
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")

          if [ -z "$PREV_TAG" ]; then
            # First release - consider app changed
            echo "app_changed=true" >> $GITHUB_OUTPUT
          else
            # Check if any files in packages/app changed
            CHANGED=$(git diff --name-only ${PREV_TAG}..HEAD -- packages/app/ | wc -l)
            if [ "$CHANGED" -gt 0 ]; then
              echo "app_changed=true" >> $GITHUB_OUTPUT
            else
              echo "app_changed=false" >> $GITHUB_OUTPUT
            fi
          fi

  # Run tests first - all builds depend on this
  test:
    runs-on: ubuntu-latest
    needs: check-changes
    if: needs.check-changes.outputs.app_changed == 'true'
    defaults:
      run:
        working-directory: packages/app
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze code
        run: flutter analyze --no-fatal-infos

      - name: Run tests
        run: flutter test --coverage

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: packages/app/coverage/lcov.info
          if-no-files-found: ignore

  # Generate changelog from commits since last tag
  changelog:
    runs-on: ubuntu-latest
    needs: check-changes
    if: needs.check-changes.outputs.app_changed == 'true'
    outputs:
      changelog: ${{ steps.changelog.outputs.changelog }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get version from tag
        id: version
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Generate changelog
        id: changelog
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: |
          # Get the previous tag
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")

          if [ -z "$PREV_TAG" ]; then
            # First release - get all commits
            COMMITS=$(git log --pretty=format:"- %s (%h)" --no-merges)
          else
            # Get commits since last tag
            COMMITS=$(git log ${PREV_TAG}..HEAD --pretty=format:"- %s (%h)" --no-merges)
          fi

          # Create changelog
          {
            echo 'changelog<<EOF'
            echo "## What's Changed"
            echo ""
            echo "$COMMITS"
            echo ""
            echo "**Full Changelog**: https://github.com/${GITHUB_REPOSITORY}/compare/${PREV_TAG}...${GITHUB_REF_NAME}"
            echo 'EOF'
          } >> $GITHUB_OUTPUT

  # Build Android APK and AAB
  build-android:
    runs-on: ubuntu-latest
    needs: [check-changes, test, changelog]
    if: needs.check-changes.outputs.app_changed == 'true'
    defaults:
      run:
        working-directory: packages/app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'

      - name: Extract version from tag
        run: |
          TAG="${{ github.ref_name }}"
          echo "VERSION=${TAG#v}" >> $GITHUB_ENV
          echo "BUILD_NUMBER=${{ github.run_number }}" >> $GITHUB_ENV

      - name: Decode keystore
        if: ${{ env.ANDROID_KEYSTORE_BASE64 != '' }}
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/upload-keystore.jks

      - name: Create key.properties
        if: ${{ env.ANDROID_KEYSTORE_BASE64 != '' }}
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cat > android/key.properties << EOF
          storeFile=upload-keystore.jks
          storePassword=$ANDROID_STORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF

      - name: Get dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release --obfuscate --split-debug-info=build/debug-info/apk --dart-define=VERSION=${{ env.VERSION }} --dart-define=BUILD_NUMBER=${{ env.BUILD_NUMBER }}

      - name: Build App Bundle
        run: flutter build appbundle --release --obfuscate --split-debug-info=build/debug-info/aab --dart-define=VERSION=${{ env.VERSION }} --dart-define=BUILD_NUMBER=${{ env.BUILD_NUMBER }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: packages/app/build/app/outputs/flutter-apk/app-release.apk

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: android-aab
          path: packages/app/build/app/outputs/bundle/release/app-release.aab

      - name: Upload debug symbols (APK)
        uses: actions/upload-artifact@v4
        with:
          name: android-apk-debug-info
          path: packages/app/build/debug-info/apk/

      - name: Upload debug symbols (AAB)
        uses: actions/upload-artifact@v4
        with:
          name: android-aab-debug-info
          path: packages/app/build/debug-info/aab/

      - name: Upload to Play Store (internal track)
        if: ${{ env.PLAY_STORE_SERVICE_ACCOUNT_JSON != '' }}
        uses: r0adkll/upload-google-play@v1
        env:
          PLAY_STORE_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_STORE_SERVICE_ACCOUNT_JSON }}
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_STORE_SERVICE_ACCOUNT_JSON }}
          packageName: com.zajel.zajel
          releaseFiles: packages/app/build/app/outputs/bundle/release/app-release.aab
          track: internal
          status: draft

  # Build iOS
  build-ios:
    runs-on: macos-latest
    needs: [check-changes, test, changelog]
    if: needs.check-changes.outputs.app_changed == 'true'
    defaults:
      run:
        working-directory: packages/app
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'

      - name: Install Apple certificate
        if: ${{ env.IOS_CERTIFICATE_BASE64 != '' }}
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          IOS_CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ github.run_id }}
        run: |
          # Create variables
          CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db

          # Import certificate from secret
          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o $CERTIFICATE_PATH

          # Create temporary keychain
          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

          # Import certificate to keychain
          security import $CERTIFICATE_PATH -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security list-keychain -d user -s $KEYCHAIN_PATH

      - name: Install provisioning profile
        if: ${{ env.IOS_PROVISIONING_PROFILE_BASE64 != '' }}
        env:
          PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          PP_PATH=$RUNNER_TEMP/build_pp.mobileprovision
          echo -n "$PROVISIONING_PROFILE_BASE64" | base64 --decode -o $PP_PATH
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp $PP_PATH ~/Library/MobileDevice/Provisioning\ Profiles

      - name: Extract version from tag
        run: |
          TAG="${{ github.ref_name }}"
          echo "VERSION=${TAG#v}" >> $GITHUB_ENV
          echo "BUILD_NUMBER=${{ github.run_number }}" >> $GITHUB_ENV

      - name: Get dependencies
        run: flutter pub get

      - name: Build iOS (signed for App Store)
        if: ${{ env.IOS_CERTIFICATE_BASE64 != '' }}
        env:
          IOS_CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
        run: flutter build ipa --release --obfuscate --split-debug-info=build/debug-info/ios --export-options-plist=ios/ExportOptions.plist --dart-define=VERSION=${{ env.VERSION }} --dart-define=BUILD_NUMBER=${{ env.BUILD_NUMBER }}

      - name: Build iOS (unsigned for GitHub release)
        if: ${{ env.IOS_CERTIFICATE_BASE64 == '' }}
        env:
          IOS_CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
        run: |
          flutter build ios --release --no-codesign --obfuscate --split-debug-info=build/debug-info/ios --dart-define=VERSION=${{ env.VERSION }} --dart-define=BUILD_NUMBER=${{ env.BUILD_NUMBER }}
          cd build/ios/iphoneos
          mkdir Payload
          cp -r Runner.app Payload/
          zip -r ../../../zajel-ios.ipa Payload

      - name: Upload iOS build
        uses: actions/upload-artifact@v4
        with:
          name: ios-build
          path: |
            packages/app/build/ios/ipa/*.ipa
            packages/app/zajel-ios.ipa
          if-no-files-found: ignore

      - name: Upload to TestFlight
        if: ${{ env.APP_STORE_CONNECT_API_KEY_BASE64 != '' }}
        env:
          API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
          APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
          API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          echo -n "$API_KEY_BASE64" | base64 --decode > ~/.appstoreconnect/private_keys/AuthKey_${API_KEY_ID}.p8
          xcrun altool --upload-app -f build/ios/ipa/*.ipa -t ios \
            --apiKey "$API_KEY_ID" --apiIssuer "$API_ISSUER_ID"

  # Build macOS
  build-macos:
    runs-on: macos-latest
    needs: [check-changes, test, changelog]
    if: needs.check-changes.outputs.app_changed == 'true'
    defaults:
      run:
        working-directory: packages/app
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'

      - name: Extract version from tag
        run: |
          TAG="${{ github.ref_name }}"
          echo "VERSION=${TAG#v}" >> $GITHUB_ENV
          echo "BUILD_NUMBER=${{ github.run_number }}" >> $GITHUB_ENV

      - name: Enable macOS desktop
        run: flutter config --enable-macos-desktop

      - name: Ensure macOS project exists
        run: flutter create --platforms=macos .

      - name: Get dependencies
        run: flutter pub get

      - name: Install Apple certificate for macOS signing
        if: ${{ env.MACOS_CERTIFICATE_BASE64 != '' }}
        env:
          MACOS_CERTIFICATE_BASE64: ${{ secrets.MACOS_CERTIFICATE_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ github.run_id }}
        run: |
          CERTIFICATE_PATH=$RUNNER_TEMP/macos_certificate.p12
          KEYCHAIN_PATH=$RUNNER_TEMP/macos-signing.keychain-db

          echo -n "$MACOS_CERTIFICATE_BASE64" | base64 --decode -o $CERTIFICATE_PATH

          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

          security import $CERTIFICATE_PATH -P "$MACOS_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security list-keychain -d user -s $KEYCHAIN_PATH

      - name: Build macOS
        run: flutter build macos --release --obfuscate --split-debug-info=build/debug-info/macos --dart-define=VERSION=${{ env.VERSION }} --dart-define=BUILD_NUMBER=${{ env.BUILD_NUMBER }}

      - name: Sign macOS app
        if: ${{ env.MACOS_CERTIFICATE_BASE64 != '' }}
        env:
          MACOS_CERTIFICATE_BASE64: ${{ secrets.MACOS_CERTIFICATE_BASE64 }}
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
        run: |
          APP_PATH="build/macos/Build/Products/Release/zajel.app"
          if [ -z "$MACOS_SIGNING_IDENTITY" ]; then
            echo "ERROR: MACOS_SIGNING_IDENTITY secret is required for signing"
            exit 1
          fi
          codesign --deep --force --options runtime --sign "$MACOS_SIGNING_IDENTITY" "$APP_PATH"

      - name: Create DMG
        run: |
          brew install create-dmg
          create-dmg \
            --volname "Zajel" \
            --window-pos 200 120 \
            --window-size 600 400 \
            --icon-size 100 \
            --app-drop-link 450 185 \
            "zajel-macos.dmg" \
            "build/macos/Build/Products/Release/zajel.app" || true
          # Fallback to zip if dmg creation fails
          if [ ! -f "zajel-macos.dmg" ]; then
            cd build/macos/Build/Products/Release
            zip -r ../../../../../zajel-macos.zip zajel.app
          fi

      - name: Notarize macOS DMG
        if: ${{ env.MACOS_CERTIFICATE_BASE64 != '' && env.MACOS_NOTARIZATION_APPLE_ID != '' }}
        env:
          MACOS_CERTIFICATE_BASE64: ${{ secrets.MACOS_CERTIFICATE_BASE64 }}
          MACOS_NOTARIZATION_APPLE_ID: ${{ secrets.MACOS_NOTARIZATION_APPLE_ID }}
          MACOS_NOTARIZATION_PASSWORD: ${{ secrets.MACOS_NOTARIZATION_PASSWORD }}
          MACOS_NOTARIZATION_TEAM_ID: ${{ secrets.MACOS_NOTARIZATION_TEAM_ID }}
        run: |
          DMG_PATH="zajel-macos.dmg"
          if [ -f "$DMG_PATH" ]; then
            xcrun notarytool submit "$DMG_PATH" \
              --apple-id "$MACOS_NOTARIZATION_APPLE_ID" \
              --password "$MACOS_NOTARIZATION_PASSWORD" \
              --team-id "$MACOS_NOTARIZATION_TEAM_ID" \
              --wait
            xcrun stapler staple "$DMG_PATH"
          fi

      - name: Upload macOS build
        uses: actions/upload-artifact@v4
        with:
          name: macos-build
          path: |
            packages/app/zajel-macos.dmg
            packages/app/zajel-macos.zip
          if-no-files-found: ignore

  # Build Windows
  build-windows:
    runs-on: windows-latest
    needs: [check-changes, test, changelog]
    if: needs.check-changes.outputs.app_changed == 'true'
    defaults:
      run:
        working-directory: packages/app
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'

      - name: Extract version from tag
        shell: bash
        run: |
          TAG="${{ github.ref_name }}"
          echo "VERSION=${TAG#v}" >> $GITHUB_ENV
          echo "BUILD_NUMBER=${{ github.run_number }}" >> $GITHUB_ENV

      - name: Install OpenSSL (release must match PR toolchain)
        shell: pwsh
        env:
          # Must match OPENSSL_CHOCO_VERSION in pr-pipeline.yml. Pinning
          # a specific 3.x version guards against runner-image bumps that
          # would otherwise shift pinned_websocket's linked libssl major
          # and ship a zip whose bundled DLLs don't match exe imports.
          OPENSSL_CHOCO_VERSION: '3.4.1'
        run: |
          choco install openssl --version=$env:OPENSSL_CHOCO_VERSION -y --no-progress --allow-downgrade
          $chocoExit = $LASTEXITCODE
          if ($chocoExit -ne 0) {
            Write-Host "WARNING: choco install returned exit code $chocoExit (may be pre-installed or CDN issue)"
          }

          $opensslRoot = "C:\Program Files\OpenSSL-Win64"
          if (-not (Test-Path $opensslRoot)) { $opensslRoot = "C:\Program Files\OpenSSL" }

          $libDir = $null
          foreach ($path in @("$opensslRoot\lib\VC\x64\MD", "$opensslRoot\lib\VC\x64", "$opensslRoot\lib")) {
            if (Test-Path "$path\libssl.lib") { $libDir = $path; break }
          }
          if ($libDir -eq $null) {
            Write-Host "ERROR: Could not find OpenSSL libraries"
            dir "$opensslRoot" -Recurse | Where-Object { $_.Name -like "*.lib" }
            exit 1
          }

          echo "OPENSSL_ROOT_DIR=$opensslRoot" >> $env:GITHUB_ENV
          echo "OPENSSL_INCLUDE_DIR=$opensslRoot\include" >> $env:GITHUB_ENV
          echo "OPENSSL_CRYPTO_LIBRARY=$libDir\libcrypto.lib" >> $env:GITHUB_ENV
          echo "OPENSSL_SSL_LIBRARY=$libDir\libssl.lib" >> $env:GITHUB_ENV
          dir "$opensslRoot\bin\libssl-*.dll", "$opensslRoot\bin\libcrypto-*.dll"
          exit 0

      - name: Get dependencies
        run: flutter pub get

      - name: Build Windows
        run: flutter build windows --release --obfuscate --split-debug-info=build/debug-info/windows --dart-define=VERSION=${{ env.VERSION }} --dart-define=BUILD_NUMBER=${{ env.BUILD_NUMBER }}

      - name: Bundle OpenSSL DLLs + verify imports match
        shell: pwsh
        run: |
          $release = "build\windows\x64\runner\Release"

          # Belt-and-braces: copy every libssl-*-x64.dll and libcrypto-*-x64.dll
          # from OpenSSL's bin into the Release folder, regardless of what
          # CMake did. Duplicate copies are harmless (overwrite the same file).
          $opensslBin = "$env:OPENSSL_ROOT_DIR\bin"
          Copy-Item "$opensslBin\libssl-*-x64.dll","$opensslBin\libcrypto-*-x64.dll" $release -Force -ErrorAction Stop

          # Parse zajel.exe's import table with System.Reflection.PortableExecutable
          # and assert every libssl-*/libcrypto-* imported DLL is present
          # next to the exe. Catches the April 2026 regression (exe imports
          # libssl-4 but zip bundles libssl-3) at build time instead of at
          # user launch.
          $exe = Join-Path $release "zajel.exe"
          $bytes = [IO.File]::ReadAllBytes($exe)
          $ms = New-Object IO.MemoryStream(,$bytes)
          Add-Type -AssemblyName "System.Reflection.Metadata"
          $peReader = New-Object System.Reflection.PortableExecutable.PEReader($ms)
          # Read imports the low-tech way: scan bytes for "libssl-" / "libcrypto-" ASCII strings.
          $asText = [Text.Encoding]::ASCII.GetString($bytes)
          $imports = [Regex]::Matches($asText, 'lib(?:ssl|crypto)-[0-9_]+-x64\.dll') | ForEach-Object { $_.Value } | Sort-Object -Unique
          Write-Host "zajel.exe imports these OpenSSL DLLs: $($imports -join ', ')"
          $missing = @()
          foreach ($imp in $imports) {
            if (-not (Test-Path (Join-Path $release $imp))) { $missing += $imp }
          }
          if ($missing.Count -gt 0) {
            Write-Host "ERROR: exe imports DLLs that are not bundled: $($missing -join ', ')"
            Write-Host "Release folder contents:"
            Get-ChildItem $release | Select-Object Name
            exit 1
          }
          Write-Host "All OpenSSL DLLs imported by zajel.exe are present in the bundle."

      - name: Decode certificate
        if: ${{ env.WINDOWS_CERTIFICATE_BASE64 != '' }}
        env:
          WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
        run: |
          $cert = [System.Convert]::FromBase64String("$env:WINDOWS_CERTIFICATE_BASE64")
          [IO.File]::WriteAllBytes("$env:RUNNER_TEMP\certificate.pfx", $cert)

      - name: Sign executable
        if: ${{ env.WINDOWS_CERTIFICATE_BASE64 != '' }}
        env:
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $signtool = Get-ChildItem -Path "C:\Program Files (x86)\Windows Kits" -Recurse -Filter signtool.exe | Select-Object -First 1 -ExpandProperty FullName
          if (-not $signtool) { throw "signtool.exe not found" }
          # Sign only the main application executable
          & $signtool sign /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 /f "$env:RUNNER_TEMP\certificate.pfx" /p "$env:WINDOWS_CERTIFICATE_PASSWORD" "build\windows\x64\runner\Release\zajel.exe"
          if ($LASTEXITCODE -ne 0) { throw "Signing failed" }

      - name: Create zip
        run: |
          Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath zajel-windows.zip

      - name: Create MSIX
        run: |
          if ("${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}" -ne "") {
            # Use real publisher certificate if available
            dart run msix:create --certificate-path "$env:RUNNER_TEMP\certificate.pfx" --certificate-password "${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}"
          } else {
            # Self-signed test certificate (auto-generated by msix package)
            dart run msix:create
          }

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: |
            packages/app/zajel-windows.zip
            packages/app/build/windows/x64/runner/Release/*.msix
          if-no-files-found: ignore

  # Build Linux
  build-linux:
    runs-on: ubuntu-latest
    needs: [check-changes, test, changelog]
    if: needs.check-changes.outputs.app_changed == 'true'
    defaults:
      run:
        working-directory: packages/app
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libsecret-1-dev
        working-directory: .

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'

      - name: Extract version from tag
        run: |
          TAG="${{ github.ref_name }}"
          echo "VERSION=${TAG#v}" >> $GITHUB_ENV
          echo "BUILD_NUMBER=${{ github.run_number }}" >> $GITHUB_ENV

      - name: Get dependencies
        run: flutter pub get

      - name: Build Linux
        run: flutter build linux --release --obfuscate --split-debug-info=build/debug-info/linux --dart-define=VERSION=${{ env.VERSION }} --dart-define=BUILD_NUMBER=${{ env.BUILD_NUMBER }}

      - name: Create tarball
        run: |
          cd build/linux/x64/release
          tar -czvf ../../../../zajel-linux.tar.gz bundle

      - name: Build AppImage
        run: |
          sudo apt-get install -y fuse libfuse2
          bash linux/packaging/build-appimage.sh \
            build/linux/x64/release/bundle \
            "zajel-linux.AppImage"

      - name: Build deb package
        run: |
          bash linux/packaging/build-deb.sh \
            build/linux/x64/release/bundle \
            "${{ env.VERSION }}" \
            "zajel-linux.deb"

      - name: Upload Linux build
        uses: actions/upload-artifact@v4
        with:
          name: linux-build
          path: |
            packages/app/zajel-linux.tar.gz
            packages/app/zajel-linux.AppImage
            packages/app/zajel-linux.deb
          if-no-files-found: ignore

  # Create GitHub Release with all artifacts
  release:
    needs: [check-changes, test, changelog, build-android, build-ios, build-macos, build-windows, build-linux]
    if: ${{ always() && needs.check-changes.outputs.app_changed == 'true' && needs.test.result == 'success' && needs.changelog.result == 'success' }}
    runs-on: ubuntu-latest
    outputs:
      hashes: ${{ steps.hash.outputs.hashes }}
      version: ${{ needs.changelog.outputs.version }}
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Display structure of downloaded files
        run: ls -R artifacts

      - name: Rename artifacts
        env:
          VERSION: ${{ needs.changelog.outputs.version }}
        run: |
          mkdir release-files
          # Android
          cp artifacts/android-apk/app-release.apk "release-files/zajel-${VERSION}-android.apk"
          cp artifacts/android-aab/app-release.aab "release-files/zajel-${VERSION}-android.aab"
          # iOS (try signed IPA first, then unsigned)
          find artifacts/ios-build -name "*.ipa" -exec cp {} "release-files/zajel-${VERSION}-ios.ipa" \; 2>/dev/null || true
          # macOS
          cp artifacts/macos-build/zajel-macos.dmg "release-files/zajel-${VERSION}-macos.dmg" 2>/dev/null || \
          cp artifacts/macos-build/zajel-macos.zip "release-files/zajel-${VERSION}-macos.zip" 2>/dev/null || true
          # Windows (zip and optionally msix)
          cp artifacts/windows-build/zajel-windows.zip "release-files/zajel-${VERSION}-windows.zip"
          find artifacts/windows-build -name "*.msix" -exec cp {} "release-files/zajel-${VERSION}-windows.msix" \; 2>/dev/null || true
          # Linux
          cp artifacts/linux-build/zajel-linux.tar.gz "release-files/zajel-${VERSION}-linux.tar.gz"
          cp artifacts/linux-build/zajel-linux.AppImage "release-files/zajel-${VERSION}-linux.AppImage" 2>/dev/null || true
          cp artifacts/linux-build/zajel-linux.deb "release-files/zajel-${VERSION}-linux.deb" 2>/dev/null || true

      - name: Generate checksums
        run: |
          cd release-files
          sha256sum zajel-* > checksums.txt
          echo "Generated checksums:"
          cat checksums.txt

      - name: Compute SHA256 hashes for all artifacts
        id: hash
        run: |
          cd release-files
          # Compute SHA256 hashes for all release artifacts
          sha256sum * > SHA256SUMS
          echo "=== SHA256SUMS ==="
          cat SHA256SUMS

          # Create base64-encoded subjects for SLSA provenance generator
          # The generator expects decoded output in sha256sum format: "HASH  FILENAME"
          HASHES=$(cat SHA256SUMS | base64 -w0)
          echo "hashes=$HASHES" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: Zajel v${{ needs.changelog.outputs.version }}
          body: |
            ${{ needs.changelog.outputs.changelog }}

            ## Verification

            This release includes SLSA L2 build provenance attestation. To verify:

            ```bash
            # Download artifacts and verification files
            VERSION="${{ needs.changelog.outputs.version }}"
            ARTIFACT="zajel-${VERSION}-android.apk"  # or any other artifact

            # 1. Verify hash integrity
            sha256sum -c SHA256SUMS --ignore-missing

            # 2. Verify SLSA provenance (requires slsa-verifier: go install github.com/slsa-framework/slsa-verifier/v2/cli/slsa-verifier@latest)
            slsa-verifier verify-artifact "$ARTIFACT" \
              --provenance-path multiple.intoto.jsonl \
              --source-uri github.com/${{ github.repository }} \
              --source-tag ${{ github.ref_name }}

            # 3. Verify Sigstore signature (requires cosign: go install github.com/sigstore/cosign/v2/cmd/cosign@latest)
            cosign verify-blob SHA256SUMS \
              --bundle SHA256SUMS.sigstore.json \
              --certificate-identity-regexp="^https://github.com/${{ github.repository }}/" \
              --certificate-oidc-issuer=https://token.actions.githubusercontent.com
            ```

            All artifacts are built from commit `${{ github.sha }}` using Flutter ${{ env.FLUTTER_VERSION }}.
          files: release-files/*
          draft: false
          prerelease: ${{ contains(github.ref, 'alpha') || contains(github.ref, 'beta') || contains(github.ref, 'rc') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Delete all pre-releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Cleaning up all pre-releases after official release..."
          PRERELEASES=$(gh release list --limit 100 --json tagName,isPrerelease \
            --jq '[.[] | select(.isPrerelease)] | .[].tagName')

          if [ -z "$PRERELEASES" ]; then
            echo "No pre-releases to clean up"
            exit 0
          fi

          for TAG in $PRERELEASES; do
            echo "  Deleting pre-release $TAG..."
            gh release delete "$TAG" --yes 2>/dev/null || true
            gh api -X DELETE "repos/${{ github.repository }}/git/refs/tags/$TAG" 2>/dev/null || true
          done
          echo "All pre-releases deleted"

  # Generate SLSA L2 provenance attestation
  # Uses the SLSA framework's reusable workflow for keyless provenance generation
  # signed via Sigstore. This runs in an isolated environment controlled by the
  # slsa-github-generator, satisfying SLSA L2 "service generated" requirement.
  provenance:
    needs: [release]
    if: needs.release.result == 'success'
    permissions:
      actions: read      # Required to read workflow path
      id-token: write    # Required for Sigstore keyless signing
      contents: write    # Required to upload attestation to release
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.1.0
    with:
      base64-subjects: "${{ needs.release.outputs.hashes }}"
      upload-assets: true
      upload-tag-name: ${{ github.ref_name }}
      provenance-name: "multiple.intoto.jsonl"

  # Sign SHA256SUMS with Sigstore cosign (keyless OIDC)
  # Downloads SHA256SUMS from the just-created GitHub release to ensure the
  # signed file exactly matches what was published. Identity is bound to the
  # GitHub Actions OIDC token (repository + workflow path).
  sign-hashes:
    needs: [release]
    if: needs.release.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      id-token: write    # Required for Sigstore OIDC keyless signing
      contents: write    # Required to upload signature to release
    steps:
      - name: Download SHA256SUMS from GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download "${{ github.ref_name }}" \
            --repo "${{ github.repository }}" \
            --pattern "SHA256SUMS" \
            --dir .
          echo "=== Downloaded SHA256SUMS ==="
          cat SHA256SUMS

      - name: Install Sigstore cosign
        uses: sigstore/cosign-installer@v4

      - name: Sign SHA256SUMS with Sigstore
        run: |
          # Keyless signing using GitHub Actions OIDC token
          # The --yes flag bypasses interactive prompts
          cosign sign-blob --yes SHA256SUMS \
            --bundle SHA256SUMS.sigstore.json

      - name: Upload signature to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: SHA256SUMS.sigstore.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Verify provenance and signatures after generation (automated gate)
  verify-provenance:
    needs: [release, provenance, sign-hashes]
    if: needs.provenance.result == 'success' && needs.sign-hashes.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Download release artifacts for verification
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p verify
          cd verify
          gh release download "${{ github.ref_name }}" \
            --repo "${{ github.repository }}" \
            --pattern "SHA256SUMS" \
            --pattern "SHA256SUMS.sigstore.json" \
            --pattern "multiple.intoto.jsonl" \
            --pattern "zajel-*" \
            --dir .
          echo "=== Downloaded files ==="
          ls -la

      - name: Verify SHA256 hashes
        run: |
          cd verify
          echo "=== Verifying SHA256 hashes ==="
          sha256sum -c SHA256SUMS
          echo "All hashes verified successfully"

      - name: Install slsa-verifier
        uses: slsa-framework/slsa-verifier/actions/installer@v2.7.1

      - name: Verify SLSA provenance for all artifacts
        run: |
          cd verify
          echo "=== Verifying SLSA provenance ==="
          for artifact in zajel-*; do
            echo "Verifying: $artifact"
            slsa-verifier verify-artifact "$artifact" \
              --provenance-path multiple.intoto.jsonl \
              --source-uri "github.com/${{ github.repository }}" \
              --source-tag "${{ github.ref_name }}"
            echo "  PASSED: $artifact"
          done
          echo "All SLSA provenance verified successfully"

      - name: Install cosign
        uses: sigstore/cosign-installer@v4

      - name: Verify Sigstore signature
        run: |
          cd verify
          echo "=== Verifying Sigstore signature ==="
          cosign verify-blob SHA256SUMS \
            --bundle SHA256SUMS.sigstore.json \
            --certificate-identity-regexp="^https://github.com/${{ github.repository }}/" \
            --certificate-oidc-issuer=https://token.actions.githubusercontent.com
          echo "Sigstore signature verified successfully"

  # Skip notification when no app changes
  skip-release:
    runs-on: ubuntu-latest
    needs: [check-production-release, check-changes]
    if: |
      always() &&
      (needs.check-production-release.outputs.is_production == 'false' ||
       needs.check-changes.outputs.app_changed == 'false')
    steps:
      - name: Skip reason
        run: |
          if [ "${{ needs.check-production-release.outputs.is_production }}" = "false" ]; then
            echo "Skipping release - this is a pre-release tag (${GITHUB_REF#refs/tags/})"
            echo "Pre-release tags like v1.5.1-build.XXXX don't trigger full releases."
            echo "Only production tags matching vX.Y.Z will trigger the release workflow."
          else
            echo "Skipping release - no changes in packages/app since last tag"
          fi
