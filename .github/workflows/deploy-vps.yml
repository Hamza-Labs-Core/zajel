name: Deploy VPS Server

on:
  push:
    branches: [main]
    paths:
      - 'packages/server-vps/**'
      - '.github/workflows/deploy-vps.yml'
  workflow_dispatch:

env:
  NODE_VERSION: '20'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: packages/server-vps/package-lock.json

      - name: Install dependencies
        working-directory: packages/server-vps
        run: npm ci

      - name: Run tests
        working-directory: packages/server-vps
        run: npm test -- --run

      - name: Build
        working-directory: packages/server-vps
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: server-vps-dist
          path: |
            packages/server-vps/dist
            packages/server-vps/package.json
            packages/server-vps/package-lock.json
            packages/server-vps/migrations
            packages/server-vps/deploy
          retention-days: 1

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: server-vps-dist
          path: deploy

      - name: Setup server environment
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ vars.VPS_SERVERS }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            set -e

            # Install Node.js 20 if not present
            if ! command -v node &> /dev/null || [[ $(node -v | cut -d. -f1 | tr -d 'v') -lt 20 ]]; then
              echo "Installing Node.js 20..."
              curl -fsSL https://deb.nodesource.com/setup_20.x | sudo -E bash -
              sudo apt-get install -y nodejs
            fi
            echo "Node.js version: $(node -v)"

            # Install PM2 if not present
            if ! command -v pm2 &> /dev/null; then
              echo "Installing PM2..."
              sudo npm install -g pm2
            fi
            echo "PM2 version: $(pm2 -v)"

            # Setup app directory
            sudo mkdir -p /opt/zajel/server-vps
            sudo chown -R $USER:$USER /opt/zajel

      - name: Prepare deployment
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ vars.VPS_SERVERS }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            set -e
            cd /opt/zajel/server-vps
            if [ -d "dist" ]; then
              rm -rf dist.backup
              mv dist dist.backup
            fi

      - name: Copy files to servers
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ vars.VPS_SERVERS }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          source: "deploy/*"
          target: "/opt/zajel/server-vps"
          strip_components: 1

      - name: Setup infrastructure (nginx, firewall, fail2ban)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ vars.VPS_SERVERS }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            set -e

            # Get public IP
            PUBLIC_IP=$(curl -sf http://checkip.amazonaws.com || curl -sf http://ifconfig.me)
            echo "Public IP: $PUBLIC_IP"

            # Setup firewall (idempotent - checks state before modifying)
            if [ -f /opt/zajel/server-vps/deploy/setup-firewall.sh ]; then
              echo "=== Configuring firewall ==="
              bash /opt/zajel/server-vps/deploy/setup-firewall.sh "${{ secrets.VPS_PORT || 22 }}"
            fi

            # Setup nginx and TLS certificates
            if [ -f /opt/zajel/server-vps/deploy/setup-nginx.sh ]; then
              echo "=== Setting up nginx ==="
              bash /opt/zajel/server-vps/deploy/setup-nginx.sh "$PUBLIC_IP" "admin@zajel.hamzalabs.dev"
            else
              echo "nginx setup script not found, checking if nginx already configured..."
              if ! systemctl is-active --quiet nginx; then
                echo "WARNING: nginx not running and setup script missing"
              fi
            fi

            # Install fail2ban if not present
            if ! command -v fail2ban-server &> /dev/null; then
              echo "=== Installing fail2ban ==="
              sudo apt-get update
              sudo apt-get install -y fail2ban
            fi

            # Configure fail2ban
            if [ -f /opt/zajel/server-vps/deploy/fail2ban-zajel.conf ]; then
              echo "=== Configuring fail2ban ==="
              sudo cp /opt/zajel/server-vps/deploy/fail2ban-zajel.conf /etc/fail2ban/jail.d/zajel.conf
              sudo cp /opt/zajel/server-vps/deploy/fail2ban-zajel-filter.conf /etc/fail2ban/filter.d/zajel-ws.conf
              sudo systemctl restart fail2ban
              sudo fail2ban-client status || true
            fi

      - name: Start server
        uses: appleboy/ssh-action@v1.0.3
        env:
          ZAJEL_ADMIN_JWT_SECRET: ${{ secrets.ZAJEL_ADMIN_JWT_SECRET }}
        with:
          host: ${{ vars.VPS_SERVERS }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          envs: ZAJEL_ADMIN_JWT_SECRET
          script: |
            set -e
            cd /opt/zajel/server-vps

            # Create data directory
            mkdir -p data

            npm ci --omit=dev

            # Create startup script with embedded env vars
            # Get public IP for the endpoint
            PUBLIC_IP=$(curl -sf http://checkip.amazonaws.com || curl -sf http://ifconfig.me || echo "localhost")
            printf '#!/bin/bash\nexport ZAJEL_HOST=127.0.0.1\nexport ZAJEL_PORT=9000\nexport ZAJEL_KEY_PATH=./data/server.key\nexport ZAJEL_DB_PATH=./data/zajel.db\nexport ZAJEL_PUBLIC_ENDPOINT=wss://%s\nexport ZAJEL_REGION=auto\nexport ZAJEL_BOOTSTRAP_URL=https://signal.zajel.hamzalabs.dev\nexport ZAJEL_ADMIN_JWT_SECRET=%s\nexport ZAJEL_CF_ADMIN_URL=https://admin.zajel.hamzalabs.dev\ncd /opt/zajel/server-vps\nexec node dist/index.js\n' "$PUBLIC_IP" "$ZAJEL_ADMIN_JWT_SECRET" > start.sh
            chmod 700 start.sh

            # Stop existing if running
            pm2 delete zajel-server 2>/dev/null || true

            # Start with PM2 using the wrapper script (increased memory limit since nginx handles connection load)
            pm2 start start.sh --name zajel-server --interpreter bash --cwd /opt/zajel/server-vps --max-memory-restart 1024M --exp-backoff-restart-delay=100
            pm2 save

            # Check PM2 status
            pm2 list
            sleep 3

            # Check port
            echo "=== Checking port 9000 ==="
            netstat -tlnp 2>/dev/null | grep :9000 || ss -tlnp | grep :9000 || echo "Port 9000 not listening"
            echo "=========================="

            # Wait for server to be ready
            echo "Waiting for server to start..."
            for i in {1..6}; do
              if curl -sf http://localhost:9000/health; then
                echo "Health check passed!"
                pm2 logs zajel-server --lines 20 --nostream || true
                exit 0
              fi
              echo "Attempt $i failed, waiting 5 seconds..."
              pm2 logs zajel-server --lines 5 --nostream 2>/dev/null || true
              sleep 5
            done

            # If we get here, show logs and fail
            echo "Health check failed after 30 seconds"
            pm2 logs zajel-server --lines 100 --nostream
            pm2 show zajel-server
            exit 1
