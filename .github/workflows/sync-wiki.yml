name: Sync Wiki

on:
  push:
    branches: [main]
    paths:
      - 'packages/wiki/**'
      - '.github/workflows/sync-wiki.yml'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Sync wiki
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          # Clone the wiki repo
          git clone "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.wiki.git" wiki-repo

          # Sync: replace wiki contents with packages/wiki/
          # Remove old files (except .git)
          find wiki-repo -maxdepth 1 -not -name '.git' -not -name '.' -not -name '..' -exec rm -rf {} +

          # Copy new files
          cp -r packages/wiki/* wiki-repo/

          # Push if changed
          cd wiki-repo
          git add -A
          if git diff --cached --quiet; then
            echo "No wiki changes to push"
          else
            git commit -m "Sync wiki from packages/wiki ($(git -C .. rev-parse --short HEAD))"
            git push
          fi
